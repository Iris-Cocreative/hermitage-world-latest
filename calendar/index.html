<!DOCTYPE html>
<html lang="en" data-product="hermitage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · Hermitage World</title>
<meta name="description" content="Every Hermitage gathering, program and retreat, by month or as a list, in your own time zone.">
<meta name="theme-color" content="#1f1405">
<link rel="icon" href="../assets/img/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Alegreya:ital@0;1&display=swap">
<link rel="stylesheet" href="../assets/vendor/trellis/core.css?v=202611242144">
<link rel="stylesheet" href="../assets/css/hermitage.css?v=202611242144">
<link rel="stylesheet" href="../assets/css/chrome.css?v=202611242144">
<link rel="stylesheet" href="../assets/css/site.css?v=202611242144">
<link rel="stylesheet" href="../assets/css/pages/gatherings.css?v=202611242144">
<script src="../assets/vendor/trellis/settle.js?v=202611242144" defer></script>
<script src="../assets/js/hw.js?v=202611242144"></script>
</head>
<body>
<hw-bar></hw-bar>

<main class="frame context" id="main">

<section class="section cc-band hw-room hw-backdrop hw-hero hw-hero-over" data-product="hermitage" data-theme="dark">
  <div class="hw-room-arch" aria-hidden="true"></div>
  <div class="stack hw-hero-text" data-reveal>
    <nav aria-label="Breadcrumb"><ol class="crumbs"><li><a href="../gatherings/">Gatherings</a></li><li aria-current="page">Calendar</li></ol></nav>
    <h1 class="t-h1" data-edit="text">Calendar</h1>
    <p class="t-lg u-text-secondary hw-lede">Gatherings, programs and retreats in your own time zone (<span data-viewer-tz>your time zone</span>). <span class="hw-draft-mark">times are placeholders until the schedule is confirmed</span></p>
  </div>
</section>

<!-- The month, flush under the hero (the old room--flush-top); not on a phone. -->
<section class="section cc-band hw-room hw-flush hw-month-band" data-product="hermitage" data-theme="dark">
  <div class="hw-month" data-gatherings="month"></div>
</section>

<section class="section cc-band hw-room hw-deep" data-product="hermitage" data-theme="dark">
  <div class="hw-room-head">
    <h2 class="t-h2" data-reveal data-edit="text">The next four weeks</h2>
    <div class="cluster" role="group" aria-label="Show" data-gatherings-filter="#upcoming" style="--cluster-gap: var(--sp-h)">
      <button class="tag hw-chip" type="button" value="all" aria-pressed="true"><span class="tag-label">Everything</span></button>
      <button class="tag hw-chip" type="button" value="online" aria-pressed="false"><span class="tag-label">Online</span></button>
      <button class="tag hw-chip" type="button" value="in-person" aria-pressed="false"><span class="tag-label">In person</span></button>
    </div>
  </div>
  <div class="section-body stack hw-g-upcoming" style="--stack-gap: var(--sp-3)" id="upcoming" data-gatherings="upcoming" data-weeks="4" aria-live="polite"></div>
</section>

</main>

<hw-letter></hw-letter>
<hw-foot></hw-foot>
<script src="../assets/data/gatherings.js?v=202611242144"></script>
</body>
</html>
